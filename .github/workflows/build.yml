name: Build AIMLD IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV

    - name: Install tools
      run: brew install ldid dpkg

    - name: Build Tweak
      run: |
        cd Tweak
        make clean || true
        make package FINALPACKAGE=1

    - name: Extract Dylib
      run: |
        cd Tweak
        DEB=$(find . -name "*.deb" | head -n 1)
        dpkg-deb -x "$DEB" extracted
        mkdir -p ../output
        find extracted -name "AIMLD.dylib" -exec cp {} ../output/ \;

    - name: Download Free Fire IPA
      run: |
        # Link tải trực tiếp từ Google Drive (ID file của Freddy)
        wget --no-check-certificate -O FreeFire.ipa "https://drive.google.com/uc?export=download&id=1JldXUQdg4mvnWYKxUokggw7Hv6gnLIny"

    - name: Inject Dylib
      run: |
        # Cài Azule (Công cụ chèn Dylib tự động)
        brew install azule
        # Chèn file AIMLD.dylib vào IPA và xuất ra file mới
        azule -i FreeFire.ipa -o AIMLD_FreeFire.ipa -f output/AIMLD.dylib

    - name: Upload Final IPA
      uses: actions/upload-artifact@v4
      with:
        name: AIMLD-Final-IPA
        path: AIMLD_FreeFire.ipa